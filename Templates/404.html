{% extends "base.html" %}
{% block title %}Not found — Dil-e-Azaad{% endblock %}

{% block content %}
<div class="card" style="text-align:center;padding:2.5rem 1.25rem;max-width:520px;margin:2rem auto">
  <h1 style="font-size:1.4rem;color:var(--green)">{{ message or "We couldn't find that page." }}</h1>
  <p class="hint" style="margin-bottom:1.25rem">
    The link may be old or mistyped. Everything else is still here.
  </p>
  <div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap">
    <a class="btn" href="{{ url_for('main.welcome') }}">Go home</a>
    <a class="btn btn-outline" href="{{ url_for('main.resources') }}">Crisis resources</a>
  </div>
</div>
{% endblock %}
